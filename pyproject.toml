
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filex"
version = "0.1.0"
description = "Offline multi-format file converter CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "pdf2docx>=0.5.8",
    "PyMuPDF",
    "python-docx>=1.1.0",
]

[project.scripts]
filex = "filex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
